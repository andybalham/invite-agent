name: Foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:foundation
      - name: Stop local services
        if: always()
        run: npm run dev:stop
      - name: Upload browser and service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-diagnostics
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            .devstack/service-logs
